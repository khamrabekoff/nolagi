name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    # тесты рассчитаны на Windows PowerShell 5.1 — тот же, что у пользователей
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверка синтаксиса, BOM и JSON (и сборка старого pckit)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\legacy\build.ps1

      - name: Сборка Nolagi.exe
        # ключа сервера в CI нет — сборка без статистики, этого достаточно для проверки
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\app\build.ps1

      - name: Тесты движка
        shell: powershell
        run: |
          $failed = @()
          foreach ($t in Get-ChildItem -Path .\tests -Filter *.Tests.ps1) {
            Write-Host "===== $($t.Name)"
            powershell -NoProfile -ExecutionPolicy Bypass -File $t.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $t.Name }
          }
          if ($failed.Count) { Write-Host ("Упали: " + ($failed -join ', ')); exit 1 }

      - name: Собранный Nolagi.exe (без статистики)
        uses: actions/upload-artifact@v4
        with:
          name: Nolagi-ci
          path: dist/Nolagi.exe

  portable:
    # тесты отката и защиты профиля не зависят от Windows — быстрый прогон в PowerShell 7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Undo.Tests (PowerShell 7)
        shell: pwsh
        run: ./tests/Undo.Tests.ps1
