name: Ошибка
description: Что-то не работает или работает не так
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Спасибо! Об уязвимостях пишите не сюда, а через Security → Report a vulnerability.
  - type: input
    id: version
    attributes:
      label: Версия Nolagi
      description: Видна в левом верхнем углу окна, рядом с названием.
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows
      placeholder: "Windows 11 Pro 24H2"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Что случилось
      description: Что вы нажали, что ожидали и что получили. Скриншот очень помогает.
    validations:
      required: true
  - type: input
    id: setting
    attributes:
      label: Какая настройка или вкладка
      placeholder: "Настройки → Видеокарта → NVIDIA: режим низкой задержки"
